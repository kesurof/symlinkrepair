name: Docker Publish
run-name: "Build ${{ inputs.version }} by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 0.3.0)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/kesurof/symlinkrepair

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set tags
        id: tags
        run: |
          BRANCH="${{ github.ref_name }}"
          VER="${{ inputs.version }}"
          if [ "$BRANCH" = "main" ]; then
            TAGS="${{ env.IMAGE_NAME }}:${VER},${{ env.IMAGE_NAME }}:latest"
          elif [ "$BRANCH" = "dev" ]; then
            TAGS="${{ env.IMAGE_NAME }}:${VER}-dev,${{ env.IMAGE_NAME }}:dev"
          else
            TAGS="${{ env.IMAGE_NAME }}:${VER}-${BRANCH}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
