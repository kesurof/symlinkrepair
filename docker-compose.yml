services:
  app:
    image: ghcr.io/kesurof/symlinkrepair:latest
    ports:
      - "${PORT:-8000}:8000"
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      # Montez ici les dossiers contenant vos bibliothèques médias
      # (library_roots configurés dans l'interface Paramètres)
      # Exemple :
      #   - /mnt:/mnt
      #   - /home/<user>/medias:/home/<user>/medias
      - /mnt:/mnt
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///data/symlinkrepair.db
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
