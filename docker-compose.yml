services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - /home/kesurof:/home/kesurof
      - /mnt:/mnt
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///data/symlinkrepair.db
      - DATA_DIR=/app/data
    networks:
      - traefik_proxy

networks:
  traefik_proxy:
    external: true
