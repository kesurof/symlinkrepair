{% extends "base.html" %}
{% block title %}Dashboard — SymlinkRepair{% endblock %}
{% block content %}
<div id="loading" class="text-center py-12 text-gray-400">Chargement...</div>

<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded-lg shadow-sm border p-4 text-center">
        <div class="text-2xl font-bold text-gray-800" id="stat-total">—</div>
        <div class="text-xs text-gray-500 mt-1">Scans</div>
    </div>
    <div class="bg-white rounded-lg shadow-sm border p-4 text-center">
        <div class="text-2xl font-bold text-amber-600" id="stat-broken">—</div>
        <div class="text-xs text-gray-500 mt-1">Cassés</div>
    </div>
    <div class="bg-white rounded-lg shadow-sm border p-4 text-center">
        <div class="text-2xl font-bold text-green-600" id="stat-fixed">—</div>
        <div class="text-xs text-gray-500 mt-1">Corrigés</div>
    </div>
    <div class="bg-white rounded-lg shadow-sm border p-4 text-center">
        <div class="text-2xl font-bold text-gray-800" id="stat-results">—</div>
        <div class="text-xs text-gray-500 mt-1">Résultats</div>
    </div>
</div>

<div class="bg-white rounded-lg shadow-sm border p-6 text-center text-gray-400">
    <p class="mb-2">Bienvenue sur SymlinkRepair</p>
    <p class="text-sm">Configurez vos serveurs dans <a href="/config" class="text-blue-600 hover:underline">Paramètres</a>,
    puis lancez un scan depuis la page <a href="/scan" class="text-blue-600 hover:underline">Scan</a>.</p>
</div>

<script>
(async function() {
    try {
        const resp = await fetch('/api/stats');
        const data = await resp.json();
        document.getElementById('stat-total').innerText = data.total_scans ?? '—';
        document.getElementById('stat-broken').innerText = data.broken ?? '—';
        document.getElementById('stat-fixed').innerText = data.fixed ?? '—';
        document.getElementById('stat-results').innerText = data.total_results ?? '—';
    } catch(e) {}
    document.getElementById('loading').style.display = 'none';
})();
</script>
{% endblock %}
