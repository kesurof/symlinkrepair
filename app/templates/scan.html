{% extends "base.html" %}
{% block title %}Scan — SymlinkRepair{% endblock %}
{% block content %}
<h2 class="text-xl font-semibold text-gray-800 mb-6">Scan</h2>
<div class="grid md:grid-cols-2 gap-4">
    <div class="bg-white rounded-lg shadow-sm border p-4">
        <h3 class="font-medium text-gray-700 mb-2">Radarr</h3>
        <p class="text-sm text-gray-500 mb-3">Analyser les films</p>
        <button hx-post="/api/scan/radarr?mode=simulate"
                hx-target="#scan-status"
                class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">
            Lancer le scan Radarr
        </button>
    </div>
    <div class="bg-white rounded-lg shadow-sm border p-4">
        <h3 class="font-medium text-gray-700 mb-2">Sonarr</h3>
        <p class="text-sm text-gray-500 mb-3">Analyser les séries</p>
        <button hx-post="/api/scan/sonarr?mode=simulate"
                hx-target="#scan-status"
                class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">
            Lancer le scan Sonarr
        </button>
    </div>
</div>
<div id="scan-status" class="mt-4"></div>
{% endblock %}
