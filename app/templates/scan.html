{% extends "base.html" %}
{% block title %}Scan — SymlinkRepair{% endblock %}
{% block content %}
<h2 class="text-xl font-semibold text-gray-800 mb-6">Lancer un scan</h2>

<div x-data="{ mode: 'simulate', limit: 50 }">
    <div class="bg-white rounded-lg shadow-sm border p-4 mb-4">
        <h3 class="font-medium text-gray-700 mb-3">Options</h3>
        <div class="flex flex-wrap gap-4">
            <div>
                <label class="block text-sm text-gray-600 mb-1">Mode</label>
                <select x-model="mode" class="border rounded px-2 py-1.5 text-sm">
                    <option value="simulate">Simulation</option>
                    <option value="clean">Nettoyage réel</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">Limite fichiers</label>
                <input type="number" x-model="limit" min="1" max="500" class="border rounded px-2 py-1.5 text-sm w-24">
            </div>
        </div>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
        <div class="bg-white rounded-lg shadow-sm border p-4">
            <h3 class="font-medium text-gray-700 mb-1">Radarr</h3>
            <p class="text-sm text-gray-500 mb-3">Films</p>
            <div x-show="mode === 'simulate'" x-cloak>
                <button hx-post="/api/scan/radarr?mode=simulate&amp;limit=500"
                        hx-target="#radarr-result"
                        hx-indicator="#radarr-spinner"
                        class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">
                    Lancer la simulation
                </button>
            </div>
            <div x-show="mode === 'clean'" x-cloak>
                <div x-data="{ confirm: false }">
                    <div x-show="!confirm" x-cloak>
                        <button @click="confirm = true"
                                class="bg-red-500 text-white px-4 py-2 rounded text-sm hover:bg-red-600">
                            Nettoyage réel
                        </button>
                    </div>
                    <div x-show="confirm" x-cloak class="flex items-center gap-2">
                        <span class="text-sm text-red-600 font-medium">Confirmer ?</span>
                        <button @click="confirm = false" class="bg-gray-200 px-3 py-1.5 rounded text-sm">Annuler</button>
                        <button hx-post="/api/scan/radarr?mode=clean&amp;limit=500"
                                hx-target="#radarr-result"
                                hx-indicator="#radarr-spinner"
                                class="bg-red-600 text-white px-3 py-1.5 rounded text-sm">
                            Confirmer
                        </button>
                    </div>
                </div>
            </div>
            <span id="radarr-spinner" class="htmx-indicator text-sm text-gray-500 ml-2">Scan en cours...</span>
            <div id="radarr-result" class="mt-3"></div>
        </div>

        <div class="bg-white rounded-lg shadow-sm border p-4">
            <h3 class="font-medium text-gray-700 mb-1">Sonarr</h3>
            <p class="text-sm text-gray-500 mb-3">Séries</p>
            <div x-show="mode === 'simulate'" x-cloak>
                <button hx-post="/api/scan/sonarr?mode=simulate&amp;limit=500"
                        hx-target="#sonarr-result"
                        hx-indicator="#sonarr-spinner"
                        class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">
                    Lancer la simulation
                </button>
            </div>
            <div x-show="mode === 'clean'" x-cloak>
                <div x-data="{ confirm: false }">
                    <div x-show="!confirm" x-cloak>
                        <button @click="confirm = true"
                                class="bg-red-500 text-white px-4 py-2 rounded text-sm hover:bg-red-600">
                            Nettoyage réel
                        </button>
                    </div>
                    <div x-show="confirm" x-cloak class="flex items-center gap-2">
                        <span class="text-sm text-red-600 font-medium">Confirmer ?</span>
                        <button @click="confirm = false" class="bg-gray-200 px-3 py-1.5 rounded text-sm">Annuler</button>
                        <button hx-post="/api/scan/sonarr?mode=clean&amp;limit=500"
                                hx-target="#sonarr-result"
                                hx-indicator="#sonarr-spinner"
                                class="bg-red-600 text-white px-3 py-1.5 rounded text-sm">
                            Confirmer
                        </button>
                    </div>
                </div>
            </div>
            <span id="sonarr-spinner" class="htmx-indicator text-sm text-gray-500 ml-2">Scan en cours...</span>
            <div id="sonarr-result" class="mt-3"></div>
        </div>
    </div>

    <div id="scan-redirect" class="mt-4"></div>
</div>

<script>
document.body.addEventListener('htmx:afterRequest', function(evt) {
    if (evt.detail.target && (evt.detail.target.id === 'radarr-result' || evt.detail.target.id === 'sonarr-result')) {
        try {
            const data = JSON.parse(evt.detail.xhr.responseText);
            if (data.ok && data.scan_id) {
                setTimeout(function() {
                    window.location.href = '/results';
                }, 1500);
            }
        } catch(e) {}
    }
});
</script>
{% endblock %}
