{% extends "base.html" %}
{% block title %}Rapports — SymlinkRepair{% endblock %}
{% block content %}
<div x-data="reportsApp()">
    <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-semibold text-gray-800">Rapports d'exécution</h2>
        <span id="reports-count" class="text-sm text-gray-500">{{ total }} scan{% if total > 1 %}s{% endif %}</span>
    </div>

    <div class="bg-white rounded-lg shadow-sm border p-3 mb-4">
        <div class="flex flex-wrap gap-2">
            <select id="filter-source"
                    class="border rounded px-2 py-1 text-sm"
                    onchange="hxNav(1)">
                <option value="">Toutes sources</option>
                {% for s in sources %}
                <option value="{{ s }}" {% if s == active_source %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
            <select id="filter-status"
                    class="border rounded px-2 py-1 text-sm"
                    onchange="hxNav(1)">
                <option value="">Tous statuts</option>
                {% for st in statuses %}
                <option value="{{ st }}" {% if st == active_status %}selected{% endif %}>{{ st }}</option>
                {% endfor %}
            </select>
            <select id="filter-mode"
                    class="border rounded px-2 py-1 text-sm"
                    onchange="hxNav(1)">
                <option value="">Tous modes</option>
                {% for m in modes %}
                <option value="{{ m }}" {% if m == active_mode %}selected{% endif %}>{{ m }}</option>
                {% endfor %}
            </select>
            <input type="text" id="filter-q" placeholder="Rechercher..."
                   class="border rounded px-2 py-1 text-sm flex-1 min-w-[200px]"
                   onkeydown="if(event.key==='Enter') hxNav(1)">
        </div>
    </div>

    <div x-show="selected.length > 0" class="bg-red-50 border border-red-200 rounded-lg p-2 mb-4 flex items-center gap-2 text-sm">
        <span class="text-red-700 font-medium" x-text="selected.length + ' sélectionné' + (selected.length > 1 ? 's' : '')"></span>
        <button @click="confirmDelete = true" class="bg-red-100 text-red-700 px-2 py-1 rounded hover:bg-red-200">Supprimer</button>
        <button @click="selected = []" class="text-gray-400 hover:text-gray-600 ml-auto">✕</button>
    </div>

    <div x-show="confirmDelete" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="confirmDelete = false">
        <div class="bg-white rounded-lg shadow-xl p-6 max-w-sm mx-4">
            <h3 class="font-semibold text-gray-800 mb-2">Confirmer la suppression</h3>
            <p class="text-sm text-gray-600 mb-4" x-text="'Supprimer ' + selected.length + ' scan' + (selected.length > 1 ? 's' : '') + ' et leurs résultats ?'"></p>
            <div class="flex gap-2 justify-end">
                <button @click="confirmDelete = false" class="bg-gray-200 px-3 py-1.5 rounded text-sm">Annuler</button>
                <button @click="batchDelete()" class="bg-red-600 text-white px-3 py-1.5 rounded text-sm">Confirmer</button>
            </div>
        </div>
    </div>

    <div id="reports-content">
        {% include "partials/reports_content.html" %}
    </div>
</div>

<script>
function hxNav(p) {
    const params = new URLSearchParams();
    const src = document.getElementById('filter-source').value;
    const st = document.getElementById('filter-status').value;
    const md = document.getElementById('filter-mode').value;
    const q = document.getElementById('filter-q').value;
    if (src) params.set('source', src);
    if (st) params.set('status', st);
    if (md) params.set('mode', md);
    if (q) params.set('q', q);
    if (p > 1) params.set('page', p);
    htmx.ajax('GET', '/reports?' + params.toString(), {target: '#reports-content', pushUrl: true});
}

// === Alpine.js : sélection + batch actions ===
function reportsApp() {
    return {
        selected: [],
        confirmDelete: false,

        currentScanIds() {
            const data = document.querySelector('#reports-content #reports-data');
            return data ? JSON.parse(data.dataset.scanIds) : [];
        },

        toggleAll(checked) {
            if (checked) { this.selected = [...this.currentScanIds()]; }
            else { this.selected = []; }
        },

        toggle(id) {
            const idx = this.selected.indexOf(id);
            if (idx === -1) { this.selected.push(id); }
            else { this.selected.splice(idx, 1); }
        },

        async batchDelete() {
            const resp = await fetch('/api/scans/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ids: this.selected})
            });
            const data = await resp.json();
            if (data.ok) {
                window.location.reload();
            } else {
                alert('Erreur: ' + (data.error || 'inconnue'));
            }
        }
    }
}
</script>
{% endblock %}
