{% extends "base.html" %}
{% block title %}Scan rapide — SymlinkRepair{% endblock %}
{% block content %}
<h2 class="text-xl font-semibold text-gray-800 mb-2">Scan rapide</h2>
<p class="text-sm text-gray-500 mb-6">
  Scan filesystem uniquement — sans appel à Sonarr/Radarr. Résultats non persistés.
</p>

<div x-data="fastScan()">
  <button @click="run()" :disabled="running"
          class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700 disabled:opacity-50"
          x-text="running ? 'Scan en cours...' : 'Lancer le scan rapide'">
  </button>

  <template x-if="results">
  <div class="mt-6 space-y-4">
    <div class="grid grid-cols-2 gap-4 max-w-xs">
      <div class="bg-white rounded-lg shadow-sm border p-4 text-center">
        <div class="text-2xl font-bold text-gray-800" x-text="results.total"></div>
        <div class="text-xs text-gray-500">Symlinks</div>
      </div>
      <div class="bg-white rounded-lg shadow-sm border p-4 text-center">
        <div class="text-2xl font-bold text-amber-600" x-text="results.broken"></div>
        <div class="text-xs text-gray-500">Cassés</div>
      </div>
    </div>

    <template x-if="results.broken > 0">
      <div class="bg-white rounded-lg shadow-sm border overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 text-left">
            <tr>
              <th class="px-3 py-2 font-medium text-gray-600">Source</th>
              <th class="px-3 py-2 font-medium text-gray-600">Symlink</th>
              <th class="px-3 py-2 font-medium text-gray-600">Cible</th>
              <th class="px-3 py-2 font-medium text-gray-600">Statut</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="item in results.results" :key="item.symlink_path">
              <tr class="border-t hover:bg-gray-50">
                <td class="px-3 py-2">
                  <span class="text-xs font-medium px-2 py-0.5 rounded"
                        :class="item.source === 'radarr' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'"
                        x-text="item.source">
                  </span>
                </td>
                <td class="px-3 py-2 text-gray-500 font-mono text-xs max-w-xs truncate" x-text="item.symlink_path"></td>
                <td class="px-3 py-2 text-gray-500 font-mono text-xs max-w-xs truncate" x-text="item.target_path"></td>
                <td class="px-3 py-2">
                  <span class="text-xs px-2 py-0.5 rounded bg-yellow-100 text-yellow-700">cassé</span>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>

    <template x-if="results.broken === 0">
      <div class="bg-green-50 border border-green-200 rounded-lg p-4 text-sm text-green-700">
        Aucun symlink cassé trouvé.
      </div>
    </template>
  </div>
</template>
</div>

<script>
function fastScan() {
  return {
    running: false,
    results: null,
    run() {
      this.running = true;
      fetch('/api/fast-scan', { method: 'POST' })
        .then(r => r.json())
        .then(data => {
          this.results = data;
          this.running = false;
        })
        .catch(() => { this.running = false; });
    },
  };
}
</script>
{% endblock %}
