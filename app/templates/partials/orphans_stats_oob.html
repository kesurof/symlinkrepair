<div id="stats-total" hx-swap-oob="true" class="text-xl font-bold text-gray-800 dark:text-gray-200">{{ total_magnets }}</div>
<div id="stats-used" hx-swap-oob="true" class="text-xl font-bold text-green-600 dark:text-green-400">{{ used_count }}</div>
<div id="stats-protected" hx-swap-oob="true" class="text-xl font-bold text-blue-600 dark:text-blue-400">{{ protected_count }}</div>
<div id="stats-orphan" hx-swap-oob="true" class="text-xl font-bold text-red-600 dark:text-red-400" data-count="{{ orphan_count }}">{{ orphan_count }}</div>
