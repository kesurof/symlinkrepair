{% extends "base.html" %}
{% block title %}Résultats — SymlinkRepair{% endblock %}
{% block content %}
<div x-data="resultsApp()" x-init='init({{ page }}, {{ total }}, {{ total_pages }})'>
    <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-semibold text-gray-800">Résultats</h2>
        <span class="text-sm text-gray-500" x-text="total + ' résultat' + (total > 1 ? 's' : '')"></span>
    </div>

    <div class="bg-white rounded-lg shadow-sm border p-3 mb-4">
        <div class="flex flex-wrap gap-2">
            <select id="filter-source"
                    class="border rounded px-2 py-1 text-sm"
                    onchange="hxNavFromFilters()">
                <option value="">Toutes sources</option>
                {% for s in sources %}
                <option value="{{ s }}" {% if s == active_source %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
            <select id="filter-status"
                    class="border rounded px-2 py-1 text-sm"
                    onchange="hxNavFromFilters()">
                <option value="">Tous statuts</option>
                {% for st in statuses %}
                <option value="{{ st }}" {% if st == active_status %}selected{% endif %}>{{ st }}</option>
                {% endfor %}
            </select>
            <select id="filter-season"
                    style="display:none"
                    class="border rounded px-2 py-1 text-sm"
                    onchange="hxNavFromFilters()">
                <option value="">Toutes saisons</option>
                {% for i in range(1, 21) %}
                <option value="{{ i }}">Saison {{ i }}</option>
                {% endfor %}
            </select>
            <input type="text" id="filter-q" placeholder="Rechercher..."
                   class="border rounded px-2 py-1 text-sm flex-1 min-w-[200px]"
                   onkeydown="if(event.key==='Enter') hxNavFromFilters()">
            <select id="filter-perpage"
                    class="border rounded px-2 py-1 text-sm"
                    onchange="hxNavFromFilters()">
                <option value="25">25 / page</option>
                <option value="50">50 / page</option>
                <option value="100">100 / page</option>
            </select>
            <label class="flex items-center gap-1.5 text-sm cursor-pointer select-none">
                <input type="checkbox" id="filter-dedup"
                       {% if not show_duplicates %}checked{% endif %}
                       onchange="hxNavFromFilters()"
                       class="rounded">
                <span class="text-gray-600">Masquer les doublons</span>
            </label>
        </div>
    </div>

    {% if total > 0 %}
    <div x-show="selected.length > 0 || true" class="bg-blue-50 border border-blue-200 rounded-lg p-2 mb-4 flex items-center gap-2 text-sm">
        <span class="text-blue-700 font-medium" x-text="selected.length + ' sélectionné' + (selected.length > 1 ? 's' : '')"></span>
        <template x-if="selected.length < total">
            <button @click="selectAllPages()" class="text-blue-600 text-xs hover:underline ml-1">
                Tout sélectionner (<span x-text="total"></span>)
            </button>
        </template>
        <button @click="batchAction('fix')" class="bg-green-100 text-green-700 px-2 py-1 rounded hover:bg-green-200">Marquer corrigé</button>
        <button @click="batchAction('ignore')" class="bg-gray-200 text-gray-700 px-2 py-1 rounded hover:bg-gray-300">Ignorer</button>
        <button @click="batchAction('recheck')" class="bg-blue-100 text-blue-700 px-2 py-1 rounded hover:bg-blue-200">Revérifier</button>
        <button @click="confirmDelete = true" class="bg-red-100 text-red-700 px-2 py-1 rounded hover:bg-red-200">Supprimer</button>
        <button @click="selected = []" class="text-gray-400 hover:text-gray-600 ml-auto">✕</button>
        <span x-show="batchMsg" x-text="batchMsg" class="text-green-600 ml-2"></span>
    </div>

    <div x-show="confirmDelete" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="confirmDelete = false">
        <div class="bg-white rounded-lg shadow-xl p-6 max-w-sm mx-4">
            <h3 class="font-semibold text-gray-800 mb-2">Confirmer la suppression</h3>
            <p class="text-sm text-gray-600 mb-4" x-text="'Supprimer ' + selected.length + ' résultat' + (selected.length > 1 ? 's' : '') + ' ?'"></p>
            <div class="flex gap-2 justify-end">
                <button @click="confirmDelete = false" class="bg-gray-200 px-3 py-1.5 rounded text-sm">Annuler</button>
                <button @click="batchAction('delete'); confirmDelete = false" class="bg-red-600 text-white px-3 py-1.5 rounded text-sm">Confirmer</button>
            </div>
        </div>
    </div>
    {% endif %}

    <div id="results-content">
        {% include "partials/results_content.html" %}
    </div>
</div>

<script>
// === Filtres : navigation HTMX sans Alpine (évite les doubles appels) ===
function hxNavFromFilters() {
    const params = new URLSearchParams();
    const src = document.getElementById('filter-source').value;
    const st = document.getElementById('filter-status').value;
    const sn = document.getElementById('filter-season').value;
    const q = document.getElementById('filter-q').value;
    const pp = document.getElementById('filter-perpage').value;
    const dd = document.getElementById('filter-dedup');
    if (src) params.set('source', src);
    if (st) params.set('status', st);
    if (sn) params.set('season', sn);
    if (q) params.set('q', q);
    if (pp !== '50') params.set('per_page', pp);
    if (dd && !dd.checked) params.set('dedup', '0');
    htmx.ajax('GET', '/results?' + params.toString(), {target: '#results-content', pushUrl: true});
}

// Afficher/masquer le filtre saison selon la source
document.getElementById('filter-season').style.display =
    document.getElementById('filter-source').value === 'sonarr' ? '' : 'none';
document.getElementById('filter-source').addEventListener('change', function() {
    document.getElementById('filter-season').style.display =
        this.value === 'sonarr' ? '' : 'none';
});

// === Alpine.js : sélection + batch actions ===
function resultsApp() {
    return {
        selected: [],
        itemIds: [],
        total: 0,
        page: 1,
        totalPages: 1,
        batchMsg: '',
        confirmDelete: false,

        init(p, t, tp) {
            this.page = p;
            this.total = t;
            this.totalPages = tp;
            this.itemIds = [{% for item in items %}{{ item.id }}{% if not loop.last %},{% endif %}{% endfor %}];
        },

        async selectAllPages() {
            const params = new URLSearchParams();
            const src = document.getElementById('filter-source').value;
            const st = document.getElementById('filter-status').value;
            const sn = document.getElementById('filter-season').value;
            const q = document.getElementById('filter-q').value;
            const dd = document.getElementById('filter-dedup');
            if (src) params.set('source', src);
            if (st) params.set('status', st);
            if (sn) params.set('season', sn);
            if (q) params.set('q', q);
            if (dd && !dd.checked) params.set('dedup', '0');
            const resp = await fetch('/api/results/ids?' + params.toString());
            const data = await resp.json();
            this.selected = data.ids || [];
        },

        toggle(id) {
            const idx = this.selected.indexOf(id);
            if (idx === -1) { this.selected.push(id); }
            else { this.selected.splice(idx, 1); }
        },

        toggleAll(checked) {
            if (checked) { this.selected = [...this.itemIds]; }
            else { this.selected = []; }
        },

        async batchAction(action) {
            if (!this.selected.length) return;
            const resp = await fetch('/api/results/batch', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: action, ids: this.selected})
            });
            const data = await resp.json();
            if (data.ok) {
                this.batchMsg = data.affected + ' mis à jour';
                this.selected = [];
                setTimeout(() => {
                    this.batchMsg = '';
                    hxNavFromFilters();
                }, 1000);
            } else {
                alert('Erreur: ' + (data.error || 'inconnue'));
            }
        }
    }
}

document.addEventListener('htmx:afterSwap', function(e) {
    if (e.detail.target && e.detail.target.id === 'results-content') {
        const data = document.getElementById('results-data');
        if (data) {
            const app = document.querySelector('[x-data="resultsApp()"]')?.__x;
            if (app) {
                app.$data.page = parseInt(data.dataset.page);
                app.$data.totalPages = parseInt(data.dataset.totalPages);
                app.$data.total = parseInt(data.dataset.total);
                app.$data.itemIds = JSON.parse(data.dataset.itemIds);
            }
        }
    }
});
</script>
{% endblock %}
