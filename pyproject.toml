[project]
name = "symlinkrepair"
version = "0.1.0"
description = "Outil de détection et réparation de liens symboliques cassés"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.18",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
